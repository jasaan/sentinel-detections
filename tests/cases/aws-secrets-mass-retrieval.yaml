rule: detections/aws-secrets-mass-retrieval.yaml
description: Reading 25 different secrets fires; an app reading one secret 200 times doesn't.
data:
  AWSCloudTrail:
    - {ago: 40m, _repeat: 25, _step: 10s, EventName: GetSecretValue, EventSource: secretsmanager.amazonaws.com, UserIdentityArn: "arn:aws:iam::123456789012:user/mallory", RecipientAccountId: "123456789012", SourceIpAddress: 198.51.100.132, RequestParameters: '{"secretId":"prod/app{i}/db"}'}
    - {ago: 40m, _repeat: 200, _step: 5s, EventName: GetSecretValue, EventSource: secretsmanager.amazonaws.com, UserIdentityArn: "arn:aws:sts::123456789012:assumed-role/app/i-0abc", RecipientAccountId: "123456789012", SourceIpAddress: 203.0.113.132, RequestParameters: '{"secretId":"prod/app/db"}'}
expect:
  rows: 1
  include:
    - {UserIdentityArn: "arn:aws:iam::123456789012:user/mallory", Secrets: 25}
  exclude:
    - {UserIdentityArn: "arn:aws:sts::123456789012:assumed-role/app/i-0abc"}

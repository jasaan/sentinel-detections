rule: detections/suspicious-scheduled-task.yaml
description: A logon task running a binary from C:\Users\Public fires; a daily backup task and a task query don't.
data:
  DeviceProcessEvents:
    - {ago: 10m, DeviceName: fin-ws-07, AccountName: carol, FileName: schtasks.exe, ProcessCommandLine: 'schtasks.exe /create /tn Updater /tr C:\Users\Public\upd.exe /sc onlogon /rl highest', InitiatingProcessFileName: rundll32.exe}
    - {ago: 10m, DeviceName: srv-app-02, AccountName: admin, FileName: schtasks.exe, ProcessCommandLine: 'schtasks.exe /create /tn Backup /tr "C:\Program Files\Backup\run.exe" /sc daily /st 02:00', InitiatingProcessFileName: cmd.exe}
    - {ago: 10m, DeviceName: it-ws-01, AccountName: alice, FileName: schtasks.exe, ProcessCommandLine: 'schtasks.exe /query /fo LIST', InitiatingProcessFileName: cmd.exe}
expect:
  rows: 1
  include:
    - {DeviceName: fin-ws-07, TaskName: Updater}
  exclude:
    - {DeviceName: srv-app-02}
    - {DeviceName: it-ws-01}

rule: detections/keyvault-mass-secret-read.yaml
description: One user reading 30 different secrets fires; an app reading one secret 40 times and 30 denied reads don't.
data:
  AzureDiagnostics:
    - {ago: 20m, _repeat: 30, ResourceProvider: MICROSOFT.KEYVAULT, Category: AuditEvent, OperationName: SecretGet, ResultSignature: OK, Resource: KV-PROD-01, CallerIPAddress: 198.51.100.66, identity_claim_upn_s: mallory@contoso.com, id_s: "https://kv-prod-01.vault.azure.net/secrets/secret-{i}"}
    - {ago: 20m, _repeat: 40, ResourceProvider: MICROSOFT.KEYVAULT, Category: AuditEvent, OperationName: SecretGet, ResultSignature: OK, Resource: KV-PROD-01, CallerIPAddress: 10.0.0.5, identity_claim_appid_g: 11111111-2222-3333-4444-555555555555, id_s: "https://kv-prod-01.vault.azure.net/secrets/db-connection"}
    - {ago: 20m, _repeat: 30, ResourceProvider: MICROSOFT.KEYVAULT, Category: AuditEvent, OperationName: SecretGet, ResultSignature: Forbidden, Resource: KV-PROD-01, CallerIPAddress: 198.51.100.70, identity_claim_upn_s: bob@contoso.com, id_s: "https://kv-prod-01.vault.azure.net/secrets/secret-{i}"}
expect:
  rows: 1
  include:
    - {Caller: mallory@contoso.com, ItemsRead: 30}
  exclude:
    - {Caller: bob@contoso.com}

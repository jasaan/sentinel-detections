rule: detections/entra-password-spray.yaml
description: One IP failing against 12 users fires and reports the one success; an IP with 4 failures doesn't.
data:
  SigninLogs:
    - {ago: 30m, _repeat: 12, UserPrincipalName: "user{i}@contoso.com", ResultType: "50126", IPAddress: 203.0.113.50, AppDisplayName: Office 365 Exchange Online}
    - {ago: 25m, UserPrincipalName: user3@contoso.com, ResultType: "0", IPAddress: 203.0.113.50, AppDisplayName: Office 365 Exchange Online}
    - {ago: 30m, _repeat: 4, UserPrincipalName: "temp{i}@contoso.com", ResultType: "50126", IPAddress: 198.51.100.20}
expect:
  rows: 1
  include:
    - {IPAddress: 203.0.113.50, TargetedUsers: 12, SuccessCount: 1}
  exclude:
    - {IPAddress: 198.51.100.20}

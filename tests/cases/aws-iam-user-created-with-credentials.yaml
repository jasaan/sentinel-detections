rule: detections/aws-iam-user-created-with-credentials.yaml
description: A new user given an access key and admin group fires; a new user with no credentials doesn't.
data:
  AWSCloudTrail:
    - {ago: 40m, EventName: CreateUser, EventSource: iam.amazonaws.com, UserIdentityArn: "arn:aws:iam::123456789012:user/mallory", RecipientAccountId: "123456789012", SourceIpAddress: 198.51.100.133, RequestParameters: '{"userName":"backup-svc2"}'}
    - {ago: 38m, EventName: CreateAccessKey, EventSource: iam.amazonaws.com, UserIdentityArn: "arn:aws:iam::123456789012:user/mallory", RecipientAccountId: "123456789012", SourceIpAddress: 198.51.100.133, RequestParameters: '{"userName":"backup-svc2"}'}
    - {ago: 37m, EventName: AddUserToGroup, EventSource: iam.amazonaws.com, UserIdentityArn: "arn:aws:iam::123456789012:user/mallory", RecipientAccountId: "123456789012", SourceIpAddress: 198.51.100.133, RequestParameters: '{"userName":"backup-svc2","groupName":"Admins"}'}
    - {ago: 30m, EventName: CreateUser, EventSource: iam.amazonaws.com, UserIdentityArn: "arn:aws:iam::123456789012:role/terraform", RecipientAccountId: "123456789012", SourceIpAddress: 203.0.113.133, RequestParameters: '{"userName":"report-reader"}'}
    - {ago: 29m, EventName: AddUserToGroup, EventSource: iam.amazonaws.com, UserIdentityArn: "arn:aws:iam::123456789012:role/terraform", RecipientAccountId: "123456789012", SourceIpAddress: 203.0.113.133, RequestParameters: '{"userName":"report-reader","groupName":"ReadOnly"}'}
expect:
  rows: 1
  include:
    - {NewUser: backup-svc2}
  exclude:
    - {NewUser: report-reader}

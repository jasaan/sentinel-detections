rule: detections/registry-hive-credential-export.yaml
description: Saving HKLM\SAM fires; querying HKLM\SYSTEM and exporting a user key don't.
data:
  DeviceProcessEvents:
    - {ago: 10m, DeviceName: fin-ws-07, AccountName: mallory, FileName: reg.exe, ProcessVersionInfoOriginalFileName: reg.exe, ProcessCommandLine: 'reg.exe save HKLM\SAM C:\Windows\Temp\s.save', InitiatingProcessFileName: cmd.exe}
    - {ago: 10m, DeviceName: it-ws-01, AccountName: alice, FileName: reg.exe, ProcessVersionInfoOriginalFileName: reg.exe, ProcessCommandLine: 'reg.exe query HKLM\SYSTEM\CurrentControlSet\Services\Tcpip', InitiatingProcessFileName: cmd.exe}
    - {ago: 10m, DeviceName: it-ws-02, AccountName: bob, FileName: reg.exe, ProcessVersionInfoOriginalFileName: reg.exe, ProcessCommandLine: 'reg.exe export HKCU\Software\Vendor C:\temp\vendor.reg', InitiatingProcessFileName: cmd.exe}
expect:
  rows: 1
  include:
    - {DeviceName: fin-ws-07}
  exclude:
    - {DeviceName: it-ws-01}
    - {DeviceName: it-ws-02}

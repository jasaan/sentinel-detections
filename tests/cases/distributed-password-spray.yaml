rule: detections/distributed-password-spray.yaml
description: Twenty users sprayed from twenty unfamiliar IPs fires once per IP; failures from an IP with past successes are left out.
data:
  SigninLogs:
    - {ago: 40m, _repeat: 20, _step: 60s, UserPrincipalName: "user{i}@contoso.com", ResultType: "50126", IPAddress: "198.51.100.1{i}", Location: US}
    - {ago: 3d, UserPrincipalName: alice@contoso.com, ResultType: "0", IPAddress: 203.0.113.10, Location: US}
    - {ago: 30m, _repeat: 30, _step: 30s, UserPrincipalName: "staff{i}@contoso.com", ResultType: "50126", IPAddress: 203.0.113.10, Location: US}
expect:
  rows: 20
  include:
    - {IPAddress: 198.51.100.11, CampaignUsers: 20, CampaignIPs: 20}
  exclude:
    - {IPAddress: 203.0.113.10}

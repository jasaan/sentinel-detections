rule: hunting/hunt-service-principal-new-credential.yaml
description: Credential additions to apps and service principals are listed; other app updates and failures aren't.
data:
  AuditLogs:
    - {ago: 2d, OperationName: Add service principal credentials, Result: success, InitiatedBy: {user: {userPrincipalName: mallory@contoso.com, ipAddress: 198.51.100.99}}, TargetResources: [{displayName: Payroll Connector, id: sp-1}]}
    - {ago: 1d, OperationName: "Update application – Certificates and secrets management ", Result: success, InitiatedBy: {user: {userPrincipalName: alice@contoso.com, ipAddress: 10.0.0.70}}, TargetResources: [{displayName: HR Sync, id: app-2}]}
    - {ago: 1d, OperationName: Update application, Result: success, InitiatedBy: {user: {userPrincipalName: alice@contoso.com, ipAddress: 10.0.0.70}}, TargetResources: [{displayName: HR Sync, id: app-2}]}
    - {ago: 1d, OperationName: Add service principal credentials, Result: failure, InitiatedBy: {user: {userPrincipalName: bob@contoso.com, ipAddress: 10.0.0.71}}, TargetResources: [{displayName: Finance Bot, id: sp-3}]}
expect:
  rows: 2
  include:
    - {AppName: Payroll Connector, Actor: mallory@contoso.com}
    - {AppName: HR Sync, Actor: alice@contoso.com}
  exclude:
    - {AppName: Finance Bot}

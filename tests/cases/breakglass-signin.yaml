rule: detections/breakglass-signin.yaml
description: Any break-glass sign-in in the last 15 minutes alerts, success or failure; normal users and older events don't.
data:
  SigninLogs:
    - {ago: 10m, UserPrincipalName: breakglass1@contoso.com, ResultType: "0", IPAddress: 203.0.113.10, Location: US, AppDisplayName: Azure Portal}
    - {ago: 5m, UserPrincipalName: BreakGlass2@contoso.com, ResultType: "50126", ResultDescription: Invalid username or password, IPAddress: 198.51.100.4, Location: RO, AppDisplayName: Azure Portal}
    - {ago: 5m, UserPrincipalName: alice@contoso.com, ResultType: "0", IPAddress: 203.0.113.20, Location: US}
    - {ago: 2h, UserPrincipalName: breakglass1@contoso.com, ResultType: "0", IPAddress: 203.0.113.10, Location: US}
expect:
  rows: 2
  include:
    - {UserPrincipalName: breakglass1@contoso.com, Outcome: Success}
    - {UserPrincipalName: BreakGlass2@contoso.com, Outcome: Failure}
  exclude:
    - {UserPrincipalName: alice@contoso.com}
